[project]
name = "dans-toolbox"
version = "0.0.9"
description = "A bunch of Python tools."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Dan Griffin", email = "dangffn@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "linkify-it-py==2.0.3",
    "markdown-it-py==4.0.0",
    "mdit-py-plugins==0.5.0",
    "mdurl==0.1.2",
    "numpy==2.3.3",
    "pillow==11.3.0",
    "platformdirs==4.5.0",
    "Pygments==2.19.2",
    "rich==14.2.0",
    "textual==6.2.1",
    "textual-imageview==0.1.1",
    "typing_extensions==4.15.0",
    "uc-micro-py==1.0.3",
    "moviepy==2.2.1",
    "paramiko==4.0.0",
    "docstring-parser>=0.18.0",
    "opencv-python>=4.13.0.92",
    "pillow-heif>=1.4.0",
    "imagehash>=4.3.2",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "pytest-cov==7.0.0",
    "pyrefly==0.41.0",
    "ruff==0.14.6",
    "pyright>=1.1.414",
    "pylint>=4.1.4",
]

[project.scripts]
toolbox = "toolbox:main.main"

[tool.uv]
package = true

[tool.pyright]
strict = ["toolbox"]
typeCheckingMode = "strict"
exclude = ["**/__pycache__"]
include = ["toolbox"]

[tool.pylint.typecheck]
# OpenCV adds its functions at import time, so pylint cannot see them.
generated-members = ["cv2.*"]

[tool.pylint."messages control"]
# W0621: pytest fixtures are passed as arguments with the same name as the fixture.
disable = ["redefined-outer-name"]
